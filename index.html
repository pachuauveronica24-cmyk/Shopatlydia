<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shop at Lydia</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#ec4899">
    <meta name="description" content="Shop at Lydia - Veronica Collection - Serchhip Mizoram">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3081/3081559.png">
    <meta name="google-site-verification" content="a7bHfhV6_FDt13dK_qWePbfz-ajO2L18nigK0eCcQoc" />
  </head>
  <body>
    <div id="install-banner" style="background: linear-gradient(135deg, #ff6b9d, #c44569); color:white; padding:12px; text-align:center; font-family:sans-serif; position:sticky; top:0; z-index:9999; display:flex; justify-content:center; align-items:center; gap:10px;">
      <span>📱</span>
      <span><b>Install Our App!</b> - Home Screen ah dah rawh!</span>
      <button onclick="if(window.deferredPrompt){window.deferredPrompt.prompt()}" style="background:white; color:#c44569; border:none; padding:6px 12px; border-radius:20px; font-weight:bold; cursor:pointer;">INSTALL</button>
      <span onclick="this.parentElement.style.display='none'" style="cursor:pointer; margin-left:10px; font-size:20px;">✕</span>
    </div>
    <script>
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      window.deferredPrompt = e;
      document.getElementById('install-banner').style.display='flex';
    });
    </script>
    <div id="root"></div>
    <script type="module" src="/main.jsx"></script>
  </body>
</html>
